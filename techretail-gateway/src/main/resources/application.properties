server.port=8090

spring.application.name=techretail-gateway

# ---------------------------------------------------------------------------
# db_esb: auditoria (auditoria_logs) + catalogo UDDI (servicios_registro).
# Acceso con JDBC clasico (JdbcTemplate/HikariCP), sin R2DBC.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_esb
spring.datasource.username=${DB_USER:techretail}
spring.datasource.password=${DB_PASSWORD:techretail123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=techretail-esb
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Seguridad: el BUS valida la firma y la expiracion de cada JWT.
# El secreto DEBE ser el mismo que usa techretail-autenticacion para firmar.
# En produccion se inyecta por entorno: JWT_SECRET=...
# ---------------------------------------------------------------------------
techretail.security.jwt.secret=${JWT_SECRET:techretail-soa-dev-secret-key-2026-cambiar-en-produccion}
techretail.security.jwt.issuer=${JWT_ISSUER:techretail-auth}
techretail.security.jwt.clock-skew-seconds=0

# ---------------------------------------------------------------------------
# Tabla de direccionamiento (Avance2, seccion 7). Cada URI es sustituible por
# entorno para el despliegue del profesor; por defecto apunta a localhost.
# ---------------------------------------------------------------------------
spring.cloud.gateway.server.webmvc.routes[0].id=clientes
spring.cloud.gateway.server.webmvc.routes[0].uri=${SERVICIO_CLIENTES_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/clientes/**

spring.cloud.gateway.server.webmvc.routes[1].id=productos
spring.cloud.gateway.server.webmvc.routes[1].uri=${SERVICIO_PRODUCTOS_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/productos/**

spring.cloud.gateway.server.webmvc.routes[2].id=pedidos
spring.cloud.gateway.server.webmvc.routes[2].uri=${SERVICIO_PEDIDOS_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/pedidos/**

spring.cloud.gateway.server.webmvc.routes[3].id=pagos
spring.cloud.gateway.server.webmvc.routes[3].uri=${SERVICIO_PAGOS_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/pagos/**

spring.cloud.gateway.server.webmvc.routes[4].id=inventario
spring.cloud.gateway.server.webmvc.routes[4].uri=${SERVICIO_INVENTARIO_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/inventario/**

spring.cloud.gateway.server.webmvc.routes[5].id=notificaciones
spring.cloud.gateway.server.webmvc.routes[5].uri=${SERVICIO_NOTIFICACIONES_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/notificaciones/**

spring.cloud.gateway.server.webmvc.routes[6].id=facturacion
spring.cloud.gateway.server.webmvc.routes[6].uri=${SERVICIO_FACTURACION_URL:http://localhost:8087}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/ws/facturacion

spring.cloud.gateway.server.webmvc.routes[7].id=autenticacion
spring.cloud.gateway.server.webmvc.routes[7].uri=${SERVICIO_AUTENTICACION_URL:http://localhost:8088}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[8].id=monitoreo
spring.cloud.gateway.server.webmvc.routes[8].uri=${SERVICIO_MONITOREO_URL:http://localhost:8089}
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/monitoreo/**

# ---------------------------------------------------------------------------
# Actuator: solo health/info expuestos y sin detalles internos.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
