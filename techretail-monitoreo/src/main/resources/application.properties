server.port=8089

spring.application.name=techretail-monitoreo

# Base de datos: Database per Service. Variables de entorno opcionales; los valores
# por defecto coinciden con docker-compose.yml (postgres en localhost:5432).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_monitoreo
spring.datasource.username=${DB_USER:techretail}
spring.datasource.password=${DB_PASSWORD:techretail123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway es la unica fuente de verdad del esquema; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ---------------------------------------------------------------------------
# Health checks periodicos: cada ciclo sondea /actuator/health y guarda el
# resultado en monitoreo_logs. Las URLs se sobreescriben por entorno.
# ---------------------------------------------------------------------------
techretail.monitoreo.intervalo-ms=${MONITOREO_INTERVALO_MS:30000}
techretail.monitoreo.timeout-ms=${MONITOREO_TIMEOUT_MS:2000}
techretail.monitoreo.scheduler.enabled=true
techretail.monitoreo.servicios[0].nombre=techretail-cliente
techretail.monitoreo.servicios[0].url=${SERVICIO_CLIENTE_URL:http://localhost:8081}/actuator/health
techretail.monitoreo.servicios[1].nombre=techretail-producto
techretail.monitoreo.servicios[1].url=${SERVICIO_PRODUCTO_URL:http://localhost:8082}/actuator/health
techretail.monitoreo.servicios[2].nombre=techretail-pedido
techretail.monitoreo.servicios[2].url=${SERVICIO_PEDIDO_URL:http://localhost:8083}/actuator/health
techretail.monitoreo.servicios[3].nombre=techretail-pago
techretail.monitoreo.servicios[3].url=${SERVICIO_PAGO_URL:http://localhost:8084}/actuator/health
techretail.monitoreo.servicios[4].nombre=techretail-inventario
techretail.monitoreo.servicios[4].url=${SERVICIO_INVENTARIO_URL:http://localhost:8085}/actuator/health
techretail.monitoreo.servicios[5].nombre=techretail-notificacion
techretail.monitoreo.servicios[5].url=${SERVICIO_NOTIFICACION_URL:http://localhost:8086}/actuator/health
techretail.monitoreo.servicios[6].nombre=techretail-facturacion-sunat
techretail.monitoreo.servicios[6].url=${SERVICIO_FACTURACION_SUNAT_URL:http://localhost:8087}/actuator/health
techretail.monitoreo.servicios[7].nombre=techretail-autenticacion
techretail.monitoreo.servicios[7].url=${SERVICIO_AUTENTICACION_URL:http://localhost:8088}/actuator/health
techretail.monitoreo.servicios[8].nombre=techretail-gateway
techretail.monitoreo.servicios[8].url=${SERVICIO_GATEWAY_URL:http://localhost:8090}/actuator/health


# ---------------------------------------------------------------------------
# Seguridad (Zero Trust): el servicio valida el JWT por si mismo. El secreto
# DEBE ser el mismo que usa techretail-autenticacion para firmar.
# ---------------------------------------------------------------------------
techretail.security.jwt.secret=${JWT_SECRET:techretail-soa-dev-secret-key-2026-cambiar-en-produccion}
techretail.security.jwt.issuer=${JWT_ISSUER:techretail-auth}
techretail.security.jwt.clock-skew-seconds=0

