server.port=8082

spring.application.name=techretail-producto

# Base de datos: Database per Service. Variables de entorno opcionales; los valores
# por defecto coinciden con docker-compose.yml (postgres en localhost:5432).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_producto
spring.datasource.username=${DB_USER:techretail}
spring.datasource.password=${DB_PASSWORD:techretail123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway es la unica fuente de verdad del esquema; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ---------------------------------------------------------------------------
# Seguridad (Zero Trust): el servicio valida el JWT por si mismo. El secreto
# DEBE ser el mismo que usa techretail-autenticacion para firmar.
# ---------------------------------------------------------------------------
techretail.security.jwt.secret=${JWT_SECRET:techretail-soa-dev-secret-key-2026-cambiar-en-produccion}
techretail.security.jwt.issuer=${JWT_ISSUER:techretail-auth}
techretail.security.jwt.clock-skew-seconds=0

# ---------------------------------------------------------------------------
# Observabilidad: /actuator/health se expone sin token porque lo consultan el
# BUS y el servicio de monitoreo (si responde 401/404 el servicio figura DOWN).
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Trazas distribuidas con OpenTelemetry. Cada peticion genera un span que se
# exporta por OTLP/HTTP a Jaeger (UI en http://localhost:16686). El endpoint
# debe incluir la ruta /v1/traces cuando se sobreescribe por entorno.
# Muestreo al 100% para que la demostracion registre todas las peticiones.
# Logs y metricas OTLP se desactivan: Jaeger solo ingiere trazas.
# ---------------------------------------------------------------------------
management.tracing.sampling.probability=${OTEL_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false

