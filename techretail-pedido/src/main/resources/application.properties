server.port=8083

spring.application.name=techretail-pedido

# Base de datos: Database per Service. Variables de entorno opcionales; los valores
# por defecto coinciden con docker-compose.yml (postgres en localhost:5432).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_pedido
spring.datasource.username=${DB_USER:techretail}
spring.datasource.password=${DB_PASSWORD:techretail123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway es la unica fuente de verdad del esquema; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration