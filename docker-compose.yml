services:
  postgres:
    image: postgres:16-alpine
    container_name: techretail-postgres
    environment:
      POSTGRES_USER: techretail
      POSTGRES_PASSWORD: techretail123
    ports:
      # 5433 en el host: el 5432 lo ocupa el PostgreSQL 18 nativo de la máquina.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql  # Ejecuta el script al iniciar

  rabbitmq:
    image: rabbitmq:3-management
    container_name: techretail-rabbitmq
    ports:
      - "5672:5672"    # AMQP (para que los servicios envíen/consuman mensajes)
      - "15672:15672"  # Panel web administrativo de RabbitMQ

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: techretail-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI web de Jaeger (consulta de trazas)
      - "4318:4318"    # OTLP/HTTP: los microservicios exportan las trazas aquí
      - "4317:4317"    # OTLP/gRPC (mismo collector, transporte alternativo)
    # Almacenamiento en memoria: suficiente para la demostración; al reiniciar
    # el contenedor se pierden las trazas.

  pgadmin:
    image: dpage/pgadmin4
    container_name: techretail-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@techretail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  pgdata: