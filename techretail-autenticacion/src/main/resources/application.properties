server.port=8088

spring.application.name=techretail-autenticacion

# Base de datos: Database per Service. Variables de entorno opcionales; los valores
# por defecto coinciden con docker-compose.yml (postgres en localhost:5432).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_autenticacion
spring.datasource.username=${DB_USER:techretail}
spring.datasource.password=${DB_PASSWORD:techretail123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway es la unica fuente de verdad del esquema; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Emision de JWT. El BUS valida con el mismo secreto (JWT_SECRET).
# ---------------------------------------------------------------------------
techretail.security.jwt.secret=${JWT_SECRET:techretail-soa-dev-secret-key-2026-cambiar-en-produccion}
techretail.security.jwt.issuer=${JWT_ISSUER:techretail-auth}
techretail.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
