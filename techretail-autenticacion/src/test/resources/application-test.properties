# Perfil de pruebas: H2 en memoria con dialecto PostgreSQL.
# El esquema se crea igualmente con las migraciones Flyway reales del modulo.
spring.datasource.url=jdbc:h2:mem:techretail-autenticacion;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Los tests crean sus propios usuarios: el seeder de demo no debe intervenir.
techretail.auth.demo-users.enabled=false